[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "societyxai"
version = "0.1.0"
description = "Research framework for studying belief dynamics and consensus formation in multi-agent generative AI systems using controlled interventions and counterfactual replay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = [
    "societyxai",
    "societyxai.core",
    "societyxai.models",
    "societyxai.interventions",
    "societyxai.parsers",
    "societyxai.tasks",
    "societyxai.traces",
    "societyxai.config",
    "societyxai.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
